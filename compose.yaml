services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:latest
    container_name: homelibrary-db
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: "YourStrong@Password123"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./sql-init:/sql-init
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong@Password123 -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
  
  db-init:
    image: mcr.microsoft.com/mssql/server:latest
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./sql-init:/sql-init
    entrypoint: /bin/bash
    command: ["-c", "sleep 15 && /opt/mssql-tools18/bin/sqlcmd -S sqlserver,1433 -U sa -P YourStrong@Password123 -C -i /sql-init/001-init.sql"]
    environment:
      SQLCMDPASSWORD: "YourStrong@Password123"
  
  homelibrary:
    image: homelibrary
    build:
      context: .
      dockerfile: HomeLibrary/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      HomeLibraryConnectionString: "Server=sqlserver,1433;Initial Catalog=HomeLibrary;User Id=sa;Password=YourStrong@Password123;Encrypt=false;TrustServerCertificate=true"
    ports:
      - "5000:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - homelibrary

volumes:
  sqlserver_data:
